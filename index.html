<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual Legal Contract Generator | منشئ العقود القانونية</title>
  <meta name="description" content="An application that acts as a senior legal counsel to generate precise, legally sound bilingual (Arabic-English) contracts based on Egyptian law. It gathers contract details from the user and then generates a formal contract.">
  <meta property="og:title" content="Bilingual Legal Contract Generator | منشئ العقود القانونية">
  <meta property="og:description" content="An application that acts as a senior legal counsel to generate precise, legally sound bilingual (Arabic-English) contracts based on Egyptian law.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="عدالة كونتراكت">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap');
    
    html, body {
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      max-width: 100vw;
    }
    
    .font-amiri {
      font-family: 'Amiri', serif;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Executive Print & PDF Optimization for Official Egyptian & International Contracts */
    @media print {
      @page {
        size: A4 portrait;
        margin: 25mm 20mm 25mm 20mm;
      }
      *, *::before, *::after {
        box-shadow: none !important;
        text-shadow: none !important;
      }
      html, body {
        background: #ffffff !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        font-family: 'Amiri', 'Cairo', Arial, sans-serif !important;
        font-size: 12pt !important;
        line-height: 1.8 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      /* Hide ALL UI navigation, buttons, controls, advisory sections */
      header, footer, nav, button, input, aside,
      .print\:hidden, .export-exclude, [data-export-exclude="true"] {
        display: none !important;
      }
      /* Clean legal document container without web card frames */
      #contract-printable-area, .contract-paper {
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        background: #ffffff !important;
        overflow: visible !important;
      }
      /* Clean, continuous legal clauses formatting in print */
      .clause-card, .clause-block {
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        margin-bottom: 14pt !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .clause-card > div:first-child, .clause-header {
        background: transparent !important;
        border: none !important;
        padding: 0 0 4pt 0 !important;
      }
      .clause-content {
        padding: 0 !important;
        background: transparent !important;
        text-align: justify !important;
        font-size: 12pt !important;
        line-height: 1.8 !important;
        color: #000000 !important;
      }
      /* Prevent awkward section and heading page breaks */
      h1, h2, h3, h4, h5, h6, .avoid-break {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      section {
        page-break-inside: auto !important;
        break-inside: auto !important;
      }
      #section-signatures {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-top: 20pt !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Adala PWA ServiceWorker registered with scope:', reg.scope))
          .catch(err => console.log('Adala PWA ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
